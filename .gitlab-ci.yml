# GitLab CI для quizkama: тесты, release APK и публикация релиза по тегу.
#
# Переменные CI/CD (Settings > CI/CD > Variables), все необязательные:
#   KEYSTORE_BASE64   - содержимое release.jks в base64 (тип Variable, masked не получится из-за
#                       длины, поэтому включите Protected и ограничьте защищёнными тегами)
#   KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD - данные ключа
# Без них release подписывается отладочным ключом: APK ставится, но не годится для обновлений
# поверх подписанных своим ключом сборок.

stages:
  - test
  - build
  - release

variables:
  GIT_DEPTH: "0"  # полная история: номер сборки считается как число коммитов (git rev-list --count)
  ANDROID_HOME: "$CI_PROJECT_DIR/.android-sdk"
  ANDROID_SDK_ROOT: "$CI_PROJECT_DIR/.android-sdk"
  GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle"
  GRADLE_OPTS: "-Dorg.gradle.daemon=false"
  CMDLINE_TOOLS_ZIP: "commandlinetools-linux-11076708_latest.zip"

# AGP 8.x требует JDK 17
image: eclipse-temurin:17-jdk

cache:
  key: gradle-and-sdk
  paths:
    - .gradle/caches
    - .gradle/wrapper
    - .android-sdk

.android-setup: &android-setup
  - apt-get update -qq && apt-get install -y -qq git unzip curl > /dev/null
  - |
    if [ ! -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
      mkdir -p "$ANDROID_HOME/cmdline-tools"
      curl -fsSL -o /tmp/cmdline-tools.zip "https://dl.google.com/android/repository/$CMDLINE_TOOLS_ZIP"
      unzip -q /tmp/cmdline-tools.zip -d "$ANDROID_HOME/cmdline-tools"
      mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
    fi
  - export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
  - yes | sdkmanager --licenses > /dev/null || true
  - sdkmanager "platform-tools" "platforms;android-35" "build-tools;34.0.0" > /dev/null
  - chmod +x gradlew

unit-tests:
  stage: test
  before_script:
    - *android-setup
  script:
    - ./gradlew testDebugUnitTest --stacktrace
  artifacts:
    when: always
    paths:
      - app/build/reports/tests/
    reports:
      junit: app/build/test-results/testDebugUnitTest/*.xml
    expire_in: 2 weeks
  rules:
    - if: $CI_COMMIT_TAG == null

build-apk:
  stage: build
  before_script:
    - *android-setup
  script:
    - ./gradlew assembleRelease --stacktrace
  artifacts:
    name: quizkama-apk
    paths:
      - app/build/outputs/apk/release/*.apk
    expire_in: 2 weeks
  rules:
    - if: $CI_COMMIT_TAG == null

# По тегу (git tag v2.12 && git push origin v2.12): собрать APK и создать релиз
release-apk:
  stage: build
  before_script:
    - *android-setup
  script:
    - |
      if [ -n "${KEYSTORE_BASE64:-}" ]; then
        echo "$KEYSTORE_BASE64" | base64 -d > "$CI_PROJECT_DIR/release.jks"
        export KEYSTORE_FILE="$CI_PROJECT_DIR/release.jks"
      else
        echo "ВНИМАНИЕ: ключ подписи не задан, release подписан отладочным ключом"
      fi
    - ./gradlew testDebugUnitTest assembleRelease --stacktrace
    - mkdir -p dist
    - cp app/build/outputs/apk/release/app-release.apk "dist/quizkama-${CI_COMMIT_TAG}.apk"
    - "$ANDROID_HOME/build-tools/34.0.0/apksigner verify --print-certs \"dist/quizkama-${CI_COMMIT_TAG}.apk\""
    - rm -f "$CI_PROJECT_DIR/release.jks"
  artifacts:
    name: quizkama-$CI_COMMIT_TAG
    paths:
      - dist/*.apk
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/

create-release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  needs:
    - job: release-apk
      artifacts: false
  script:
    - echo "Релиз $CI_COMMIT_TAG"
  release:
    tag_name: $CI_COMMIT_TAG
    name: "quizkama $CI_COMMIT_TAG"
    description: "Сборка из тега $CI_COMMIT_TAG"
    assets:
      links:
        - name: "quizkama-${CI_COMMIT_TAG}.apk"
          url: "${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_TAG}/raw/dist/quizkama-${CI_COMMIT_TAG}.apk?job=release-apk"
          link_type: package
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/
