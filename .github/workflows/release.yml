name: Релиз

# Релиз создаётся при пуше тега вида v2.12: git tag v2.12 && git push origin v2.12
on:
  push:
    tags: ['v*']

permissions:
  contents: write # нужно, чтобы создать GitHub Release и приложить APK

jobs:
  release:
    name: Собрать и опубликовать APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Получить код
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # полная история нужна для номера сборки (git rev-list --count)

      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;34.0.0'

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Права на запуск gradlew
        run: chmod +x gradlew

      - name: Юнит-тесты
        run: ./gradlew testDebugUnitTest --stacktrace

      # Если заданы секреты подписи, release подписывается вашим ключом (Gradle читает
      # KEYSTORE_FILE, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD). Если нет, он подписывается
      # отладочным ключом, а релиз помечается как pre-release.
      - name: Сборка release APK
        id: build
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          if [ -n "${KEYSTORE_BASE64:-}" ]; then
            echo "${KEYSTORE_BASE64}" | base64 -d > "${RUNNER_TEMP}/release.jks"
            export KEYSTORE_FILE="${RUNNER_TEMP}/release.jks"
            echo "signed=true" >> "${GITHUB_OUTPUT}"
          else
            echo "::warning::Секреты подписи не заданы: release подписан отладочным ключом"
            echo "signed=false" >> "${GITHUB_OUTPUT}"
          fi
          ./gradlew assembleRelease --stacktrace
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/quizkama-${TAG}.apk"
          "${ANDROID_HOME}/build-tools/34.0.0/apksigner" verify --print-certs "dist/quizkama-${TAG}.apk"
          rm -f "${RUNNER_TEMP}/release.jks"

      - name: Опубликовать релиз
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
          prerelease: ${{ steps.build.outputs.signed != 'true' }}
