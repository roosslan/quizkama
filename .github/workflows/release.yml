name: Релиз

# Релиз создаётся при пуше тега вида v2.12: git tag v2.12 && git push origin v2.12
on:
  push:
    tags: ['v*']

permissions:
  contents: write # нужно, чтобы создать GitHub Release и приложить APK

jobs:
  release:
    name: Собрать и опубликовать APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Получить код
        uses: actions/checkout@v4

      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-26 build-tools;26.0.2'

      - name: JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: gradle

      - name: Права на запуск gradlew
        run: chmod +x gradlew

      - name: Юнит-тесты
        run: ./gradlew testDebugUnitTest --stacktrace

      # Если заданы секреты подписи, собираем release и подписываем своим ключом.
      # Если нет, публикуем debug-сборку (она подписана отладочным ключом и ставится вручную),
      # а релиз помечается как pre-release.
      - name: Сборка и подпись APK
        id: build
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          BT="${ANDROID_HOME}/build-tools/26.0.2"
          mkdir -p dist
          if [ -n "${KEYSTORE_BASE64:-}" ]; then
            ./gradlew assembleRelease --stacktrace
            "${BT}/zipalign" -f -p 4 app/build/outputs/apk/release/app-release-unsigned.apk "${RUNNER_TEMP}/aligned.apk"
            echo "${KEYSTORE_BASE64}" | base64 -d > "${RUNNER_TEMP}/release.jks"
            "${BT}/apksigner" sign \
              --ks "${RUNNER_TEMP}/release.jks" \
              --ks-pass env:KEYSTORE_PASSWORD \
              --key-alias "${KEY_ALIAS}" \
              --key-pass env:KEY_PASSWORD \
              --out "dist/quizkama-${TAG}.apk" \
              "${RUNNER_TEMP}/aligned.apk"
            "${BT}/apksigner" verify "dist/quizkama-${TAG}.apk"
            rm -f "${RUNNER_TEMP}/release.jks"
            echo "signed=true" >> "${GITHUB_OUTPUT}"
          else
            echo "::warning::Секреты подписи не заданы: публикуется debug-сборка"
            ./gradlew assembleDebug --stacktrace
            cp app/build/outputs/apk/debug/app-debug.apk "dist/quizkama-${TAG}-debug.apk"
            echo "signed=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Опубликовать релиз
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
          prerelease: ${{ steps.build.outputs.signed != 'true' }}
