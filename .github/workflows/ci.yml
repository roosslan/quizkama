name: CI

on:
  push:
    branches: [trunk]
  pull_request:
  workflow_dispatch:

# Новый запуск для той же ветки отменяет предыдущий, ещё не завершённый
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Тесты и сборка debug
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Получить код
        uses: actions/checkout@v4

      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;34.0.0'

      # AGP 8.x требует JDK 17
      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Права на запуск gradlew
        run: chmod +x gradlew

      - name: Юнит-тесты
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Сборка debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Отчёты тестов
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore

      - name: Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: quizkama-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
