name: CI

on:
  push:
    branches: [trunk]
  pull_request:
  workflow_dispatch:

# Новый запуск для той же ветки отменяет предыдущий, ещё не завершённый
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Тесты и сборка debug
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Получить код
        uses: actions/checkout@v4

      # SDK ставим под JDK по умолчанию (17): sdkmanager нового образца на Java 8 не запускается
      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-26 build-tools;26.0.2'

      # Проект собирается Gradle 4.1 и AGP 3.0.1, им нужна именно Java 8
      - name: JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: gradle

      - name: Права на запуск gradlew
        run: chmod +x gradlew

      - name: Юнит-тесты
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Сборка debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Отчёты тестов
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore

      - name: Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: quizkama-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
